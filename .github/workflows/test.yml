name: "Test Cassandra-Stress"

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        java: ["21", "25"]
    uses: "./.github/workflows/build.yml"
    with:
      version: "1.0.0"
      java: "${{ matrix.java }}"

  package-test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu:24.04", "debian:bookworm-slim", "fedora:41", "fedora:42"]
        java: ["21", "25"]
    name: "Package test ${{ matrix.os }} with Java ${{ matrix.java }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install and run the package
        run: >-
          ./gradlew :core:packageTest -Pversion=1.0.0
          -Dstress.package.images=${{ matrix.os }}
          -Dstress.package.java=${{ matrix.java }}

  build-test:
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unit tests
        run: ./gradlew test

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Format check and linters
        run: ./gradlew lint
      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            src/*/build/reports/checkstyle
            src/*/build/reports/pmd
            src/*/build/reports/spotbugs
            src/*/build/reports/errorprone
          if-no-files-found: ignore

  distribution-test:
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    name: "Distribution test with Java ${{ matrix.java }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run the installed launcher against ScyllaDB
        run: ./gradlew :core:distributionTest -PtestJvmArgs="${{ matrix.java == '25' && '--sun-misc-unsafe-memory-access=deny' || '' }}"

  docker:
    name: "Docker image"
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the image
        run: ./gradlew dockerImage -Pversion=1.0.0 -PdockerImage=cassandra-stress
      - name: Run the image
        run: |
          docker run --rm cassandra-stress:1.0.0 version | grep -x "Version: 1.0.0"

