name: "Build Cassandra-Stress"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Version of the release"
      java:
        required: false
        description: "Java version"
        type: string
        default: "21"
  workflow_call:
    inputs:
      version:
        required: false
        description: "Version of the release"
        type: string
      java:
        required: false
        description: "Java version"
        type: string
        default: "21"
jobs:
  build:
    name: Build Cassandra-Stress ${{ inputs.version }} for Java ${{ inputs.java }}
    strategy:
      matrix:
        os: ["ubuntu-24.04"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Artifacts
        run: |
          ./gradlew assemble -Pversion=${{ inputs.version }}

          cd build/distributions
          for ext in "" .sha256 .sha512; do
            mv "scylladb-cassandra-stress.tar.gz$ext" "scylladb-cassandra-stress-bin-java${{ inputs.java }}.tar.gz$ext"
            mv "scylladb-cassandra-stress-src.tar.gz$ext" "scylladb-cassandra-stress-src-java${{ inputs.java }}.tar.gz$ext"
          done
          mv scylladb-cassandra-stress_${{ inputs.version }}_all.deb scylladb-cassandra-stress-java${{ inputs.java }}_${{ inputs.version }}_all.deb
          mv scylladb-cassandra-stress-${{ inputs.version }}-1.noarch.rpm scylladb-cassandra-stress-java${{ inputs.java }}-${{ inputs.version }}-1.noarch.rpm
          mv cassandra-stress_${{ inputs.version }}_all.deb scylladb-cassandra-stress-transitional_${{ inputs.version }}_all.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scylladb-cassandra-stress-java${{ inputs.java }}
          path: |
            build/distributions/scylladb-cassandra-stress-bin-java${{ inputs.java }}.tar.gz
            build/distributions/scylladb-cassandra-stress-bin-java${{ inputs.java }}.tar.gz.sha256
            build/distributions/scylladb-cassandra-stress-bin-java${{ inputs.java }}.tar.gz.sha512
            build/distributions/scylladb-cassandra-stress-src-java${{ inputs.java }}.tar.gz
            build/distributions/scylladb-cassandra-stress-src-java${{ inputs.java }}.tar.gz.sha256
            build/distributions/scylladb-cassandra-stress-src-java${{ inputs.java }}.tar.gz.sha512
            build/distributions/scylladb-cassandra-stress-java${{ inputs.java }}_${{ inputs.version }}_all.deb
            build/distributions/scylladb-cassandra-stress-java${{ inputs.java }}-${{ inputs.version }}-1.noarch.rpm
            build/distributions/scylladb-cassandra-stress-transitional_${{ inputs.version }}_all.deb
